<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominus Gestor - Cadastro de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h3>Dominus Gestor</h3>
            <span class="badge cliente">OPERADOR</span>
            <nav>
                <a href="sistema.html" class="active">Cadastro de Clientes</a>
            </nav>
        </aside>
        <main class="content">
            <header>
                <h2>Módulo de Cadastro de Clientes & Fornecedores</h2>
            </header>
            <section class="card">
                <form id="clienteForm">
                    <div class="form-row">
                        <div><label>Razão Social</label><input type="text" placeholder="Nome da Empresa"></div>
                        <div><label>CNPJ</label><input type="text" placeholder="00.000.000/0001-00"></div>
                    </div>
                    <button type="submit" class="btn-primary">Salvar Cliente</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
