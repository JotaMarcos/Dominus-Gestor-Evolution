quarkus.http.port=8080
quarkus.http.enable-compression=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/dominus_db}
quarkus.datasource.username=${DB_USER:dominus}
quarkus.datasource.password=${DB_PASS:}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=30S
quarkus.datasource.jdbc.leak-detection-interval=10S
quarkus.datasource.devservices.enabled=false

# Ambiente local sem Docker: banco efêmero compatível com PostgreSQL.
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:dominus_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.max-size=10
%dev.quarkus.datasource.jdbc.min-size=1
