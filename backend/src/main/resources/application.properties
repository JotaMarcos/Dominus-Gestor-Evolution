quarkus.http.port=8080
quarkus.http.enable-compression=true

# ============================================================================
# OpenAPI / Swagger UI (documentação interativa da API REST)
# Disponível em /q/swagger-ui — especificação bruta em /q/openapi
# ============================================================================
quarkus.smallrye-openapi.info-title=Dominus Gestor Evolution API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST do Dominus Gestor Evolution: autenticação e MFA, usuários, clientes, lançamentos financeiros e exportação de relatórios.
quarkus.smallrye-openapi.info-contact-name=João Marcos Aires Duarte
quarkus.smallrye-openapi.info-contact-url=https://github.com/JotaMarcos
quarkus.swagger-ui.always-include=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/dominus_db}
quarkus.datasource.username=${DB_USER:dominus}
quarkus.datasource.password=${DB_PASS:}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=30S
quarkus.datasource.jdbc.leak-detection-interval=10S
quarkus.datasource.devservices.enabled=false

# Ambiente local sem Docker (dev) e testes automatizados (test): banco efêmero
# compatível com PostgreSQL, recriado a cada execução.
%dev,test.quarkus.datasource.db-kind=h2
%dev,test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dominus_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
%dev,test.quarkus.datasource.username=sa
%dev,test.quarkus.datasource.password=
%dev,test.quarkus.datasource.jdbc.max-size=10
%dev,test.quarkus.datasource.jdbc.min-size=1

# ============================================================================
# Sessão de autenticação (JWT assinado, entregue via cookie HttpOnly)
# ============================================================================
# Em produção, JWT_PRIVATE_KEY_LOCATION e JWT_PUBLIC_KEY_LOCATION devem apontar
# para os segredos gerados pelo operador (ver docker-compose.yml e README) -
# não existe par de chaves padrão fora dos perfis dev/test.
mp.jwt.verify.issuer=https://dominus-gestor.local
smallrye.jwt.new-token.issuer=https://dominus-gestor.local
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=dominus_session
quarkus.security.jaxrs.deny-unannotated-endpoints=true

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
dominus.cookie.secure=false
%prod.dominus.cookie.secure=true

# Perfil dev (sem Docker): par de chaves de conveniência, nunca usado fora do dev.
%dev.mp.jwt.verify.publickey.location=dev/jwt-dev-public-key.pem
%dev.smallrye.jwt.sign.key.location=dev/jwt-dev-private-key.pem

# Perfil test (mvn test / @QuarkusTest): par de chaves fixo só para testes automatizados.
%test.mp.jwt.verify.publickey.location=jwt-test-public-key.pem
%test.smallrye.jwt.sign.key.location=jwt-test-private-key.pem
