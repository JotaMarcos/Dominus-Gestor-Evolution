<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dominus Gestor - Autenticação MFA</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <h2>Dominus Gestor</h2>
      <p class="subtitle">Acesso ao Sistema de Gestão Financeira</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Login ou e-mail corporativo</label>
          <input
            type="text"
            id="email"
            required
            autocomplete="username"
            placeholder="Admin ou seu e-mail"
          />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="••••••••" />
        </div>
        <div id="mfaSection" class="form-group hidden">
          <label for="mfaCode">Código MFA / 2FA (Authenticator)</label>
          <input
            type="text"
            id="mfaCode"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="123456"
          />
        </div>
        <p
          id="loginError"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>
        <button type="submit" id="btnLogin" class="btn-primary">
          Entrar no Sistema
        </button>
      </form>
      <p class="form-link">
        <a href="cadastro.html">Criar acesso de operador</a>
      </p>
    </div>
    <script src="js/auth.js"></script>
  </body>
</html>
