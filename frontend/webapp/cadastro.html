<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dominus Gestor - Cadastro de Acesso</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <h2>Criar acesso</h2>
      <p class="subtitle">Cadastre um usuário operador do Dominus Gestor</p>
      <form id="cadastroForm">
        <div class="form-group">
          <label for="nome">Nome completo</label><input id="nome" required />
        </div>
        <div class="form-group">
          <label for="login">Login</label
          ><input id="login" required minlength="3" />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label
          ><input id="email" type="email" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label
          ><input id="senha" type="password" required minlength="8" />
        </div>
        <p
          id="cadastroMensagem"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>
        <button type="submit" class="btn-primary">Cadastrar usuário</button>
      </form>
      <p class="form-link"><a href="index.html">Voltar para o login</a></p>
    </main>
    <script src="js/cadastro.js"></script>
  </body>
</html>
